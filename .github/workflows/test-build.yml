name: Test Run Gift Exchange

on:
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  run_script:
    name: Test run xmas-change.py
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      id: aws-creds
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::157437238176:role/github-actions-xmas-xchange-role
        aws-region: ca-central-1

    - name: Generate .env
      run: |
        cat << EOF > .env
        TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
        AWS_ACCESS_KEY_ID=${{ steps.aws-creds.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY=${{ steps.aws-creds.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN=${{ steps.aws-creds.outputs.aws-session-token }}
        AWS_REGION=ca-central-1
        S3_BUCKET=${{ secrets.S3_BUCKET }}
        EOF

    - name: Generate json/data.json
      run: echo "${{ secrets.DATA_JSON }}" | base64 -d > ./json/data.json

    - name: Build Docker Image
      run: docker build -t xmas-xchange .

    - name: Run Docker Image
      run: |
        docker run --env-file .env --rm xmas-xchange --github-test

    - name: Run test.py script with example data
      run: |
        docker run --env-file .env \
          --rm -v $(pwd)/json/data.example.json:/app/json/data.json \
          --entrypoint python xmas-xchange test.py

    - name: Reminder to clean up test files
      run: echo "⚠️ Remember to manually clean up any github_*_dryrun.txt files from S3 as needed!"